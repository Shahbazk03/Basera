# Local development infrastructure.
# Application processes (api/web/console) run on the host via `npm run dev`.
# For a containerised production-like stack see infrastructure/deployment/docker-compose.prod.yml.
name: estate-platform

services:
  # MongoDB as a single-node replica set (Prisma needs a replica set for transactions and nested writes).
  # Development only: no authentication, published on localhost. Production uses MongoDB Atlas.
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:${MONGO_HOST_PORT:-27018}:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initialises the replica set on first start, then reports its status.
      test: ['CMD-SHELL', "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }\""]
      interval: 5s
      timeout: 15s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Development mail catcher. Captures SMTP mail locally (UI on :8025); nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  mongodata:
  redisdata:
