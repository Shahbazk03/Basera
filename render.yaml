# Render Blueprint — Basera backend (API + background jobs) and its Redis-compatible queue store.
# Render dashboard → New → Blueprint → choose this repository. Values marked `sync: false` are asked for
# during setup and are never stored in this file. Step-by-step guide: docs/deployment/render-vercel-atlas-s3.md
services:
  - type: web
    name: basera-api
    runtime: docker
    region: singapore            # same region as the MongoDB Atlas cluster
    plan: free                   # no card needed; sleeps after 15 min idle (first visit then takes ~1 min, scheduled jobs pause). "starter" stays on
    dockerfilePath: ./infrastructure/docker/api.render.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      # MongoDB Atlas → Connect → Drivers: the mongodb+srv:// string with your database user's password
      # and the database name added before the "?", e.g. …mongodb.net/basera?retryWrites=true&w=majority
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: basera-redis
          property: connectionString
      # Secrets generated by Render (random 256-bit values)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: FILE_URL_SIGNING_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Browser → Vercel → Render: the client IP is two proxies back
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: SWAGGER_ENABLED
        value: "false"
      # Public addresses of the two Vercel apps, e.g. https://basera-web.vercel.app
      - key: WEB_PUBLIC_URL
        sync: false
      - key: CONSOLE_PUBLIC_URL
        sync: false
      # The website's own domain (until you buy one: the website's vercel.app host, e.g. basera-web.vercel.app)
      - key: PLATFORM_ROOT_DOMAIN
        sync: false
      - key: PLATFORM_MAIN_HOSTS
        sync: false
      - key: TLS_PROVIDER
        value: none
      # Photos and documents are kept inside the MongoDB database — no separate storage service (on the
      # Atlas free tier the 512 MB is shared by data and files). S3-compatible storage later: STORAGE_DRIVER=s3.
      - key: STORAGE_DRIVER
        value: database
      # First Super Admin, created on the first start (an existing one is never changed)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: basera-redis
    region: singapore
    plan: free                   # job queue only; queued messages are also kept in MongoDB, so nothing is lost on restart
    maxmemoryPolicy: noeviction  # never silently drop queued jobs
    ipAllowList: []              # reachable only from your Render services
